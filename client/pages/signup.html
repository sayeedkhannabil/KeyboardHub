<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up — KeyboardHub</title>
  <link rel="stylesheet" href="../css/neo.css">
  <link rel="stylesheet" href="../css/signup.css">
</head>
<body>
  <div class="login-section">
    <div class="login-form">
      <h1 class="login-heading">Sign Up</h1>
      <div class="login-fields"><input type="email"    placeholder="Email"/></div>
      <div class="login-fields"><input type="password" placeholder="Password"/></div>
      <div class="login-fields"><input type="password" placeholder="Retype Password"/></div>
      <div class="login-btn"><button type="submit">Create Account</button></div>
    </div>
  </div>
</body>
</html>
